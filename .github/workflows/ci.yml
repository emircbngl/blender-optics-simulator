name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Both ends of the supported range. 4.2.3 is blender_version_min and stays the gate for
    # "does it still run on the oldest build"; 5.1.1 covers the top, which ships a 5.x-specific
    # artifact (build_platform_zip bundles cp313 wheels for it) that no job had ever exercised on
    # 5.x. fail-fast off: a break at one end must not hide the state of the other.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        blender: ["4.2.3", "5.1.1"]
    env:
      BLENDER_VERSION: ${{ matrix.blender }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true     # opt the checkout/cache actions onto Node 24
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for headless Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libxrender1 xkb-data xvfb

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender ${{ env.BLENDER_VERSION }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          MAJ=$(echo "$BLENDER_VERSION" | cut -d. -f1,2)
          curl -fL -o /tmp/blender.tar.xz \
            "https://download.blender.org/release/Blender${MAJ}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf /tmp/blender.tar.xz -C ~/blender --strip-components=1

      - name: Blender version
        run: ~/blender/blender --version

      - name: Physics self-test (bare interpreter)
        run: python3 optical_alignment_sim/physics.py

      - name: Release metadata consistency
        # Keep the add-on manifest, citation, changelog, Pages metadata and
        # MCP package declarations aligned before a release artifact is made.
        run: python3 tools/check_release_consistency.py

      - name: Store-build compliance audit (extensions.blender.org delist-guard)
        # Transforms a COPY of the source into the store tree and runs the SYSTEMATIC AST
        # import audit: every import must be stdlib / Blender-bundled / wheeled -- optional
        # imports are not allowed on the platform (their words). Pure python, no network,
        # no Blender. The platform warned that the first post-approval version with issues
        # means a permanent delist, so this gate runs on every push, forever.
        run: python3 tools/build_platform_zip.py --audit-only

      - name: Extension validate
        run: ~/blender/blender --command extension validate optical_alignment_sim

      - name: Headless regression
        # --python-exit-code 1: without it Blender exits 0 on an unhandled Python
        # exception, so a mid-run crash would leave CI green
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_optics.py

      - name: Textbook validation (closed forms vs known answers)
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_validation.py

      - name: Unit equivalence (a declared metre scene reads the same mm as a mm scene)
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_units.py

      - name: Agent control contract and nonlinear/tolerance witnesses
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_agent_control.py

      - name: Review regressions and iris selection safety
        run: |
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_review_regressions.py
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_iris_regen.py

      - name: Animation render re-bakes beams per frame (real render pipeline)
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_render_animation.py

      - name: Group delay and GDD along traced routes
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_dispersion.py

      - name: Two-part OPA element
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_opa.py

      - name: Grating orientation, broadband library, cylindrical lenses and spectral detector
        run: |
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_feedback.py
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_cylindrical_spectrum.py

      - name: Parameter schema (every input of every element type is in its schema and drawn)
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_param_schema.py

      - name: Beam appearance (render-only material, optical invariance)
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_beam_appearance.py

      - name: Mechanical metadata schema and catalog inventory
        run: |
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_mechanical_schema.py
          python3 tools/check_mechanical_inventory.py

      - name: Mechanical compatibility engine (verdicts, evidence, adapter chains)
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_mechanical_compatibility.py

      - name: Mechanical assembly graph (states, ownership vs physical loops, locks)
        run: |
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_mechanical_assembly.py
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_mechanical_assembly_geometry.py

      - name: Post and post holder against the vendor drawings (TR50/M, PH50/M), and joined
        run: |
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_support_geometry.py
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_support_assembly.py

      - name: Render hardware detail (render-only, restores the bench) and generic mount catalog
        run: |
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_hardware_render.py
          xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_hardware_catalog.py

      - name: Mesh health (elements bare + mounts dressed, render-free)
        # numeric leg of the mount/element structural audit: non-manifold/loose-vert gate per
        # element mesh, BVH contact gate per dressed mount part. No renders in CI by design --
        # close-up render inspection (tools/inspect_*.py) stays a release-time step.
        run: xvfb-run -a ~/blender/blender --background --factory-startup --python-exit-code 1 --python tests/test_mesh_health.py

  store-build:
    # FULL store-build smoke (finding: --audit-only alone never exercises the transform anchors,
    # the pinned wheel fetch, or Blender's extension build/validate -- so a drift would only
    # surface at release time). Builds the real 4 platform zips on every push.
    runs-on: ubuntu-latest
    env:
      BLENDER_VERSION: "4.2.3"
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for headless Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libxrender1 xkb-data

      - name: Cache Blender
        id: cache-blender
        uses: actions/cache@v4
        with:
          path: ~/blender
          key: blender-${{ env.BLENDER_VERSION }}-linux-x64

      - name: Download Blender ${{ env.BLENDER_VERSION }}
        if: steps.cache-blender.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/blender
          MAJ=$(echo "$BLENDER_VERSION" | cut -d. -f1,2)
          curl -fL -o /tmp/blender.tar.xz \
            "https://download.blender.org/release/Blender${MAJ}/blender-${BLENDER_VERSION}-linux-x64.tar.xz"
          tar -xf /tmp/blender.tar.xz -C ~/blender --strip-components=1

      - name: Cache pip download cache (wheel fetch)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-wheels-${{ hashFiles('tools/build_platform_zip.py') }}

      - name: Full store build (transform + pinned wheels + split-platform zips + validate)
        run: OAS_BLENDER=~/blender/blender python3 tools/build_platform_zip.py

      - name: Assert 4 platform zips
        run: |
          ls -l dist/platform/
          test "$(ls dist/platform/*.zip | wc -l)" -eq 4
