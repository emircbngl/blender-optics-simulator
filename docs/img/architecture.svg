<svg viewBox="0 0 940 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a92"/>
    </marker>
  </defs>
  <rect width="940" height="360" fill="#0d0d10"/>
  <text x="470" y="38" fill="#f4f4f6" font-size="21" font-weight="700" text-anchor="middle">Property-driven, oracle-verified — behaviour is data, not a per-scene script</text>

  <!-- 1 elements -->
  <rect x="34" y="92" width="206" height="190" rx="12" fill="#11212b" stroke="#4a8db0" stroke-width="1.6"/>
  <text x="137" y="120" fill="#7fc3e3" font-size="14.5" font-weight="700" text-anchor="middle">ELEMENT</text>
  <text x="137" y="142" fill="#cfd2d6" font-size="11" text-anchor="middle">data, no per-scene code</text>
  <text x="137" y="172" fill="#e8e8ea" font-size="10.6" text-anchor="middle">properties: focal, split,</text>
  <text x="137" y="190" fill="#e8e8ea" font-size="10.6" text-anchor="middle">retardance, coating, n(λ)…</text>
  <text x="137" y="214" fill="#e8e8ea" font-size="10.6" text-anchor="middle">ports (IN / OUT / REFLECT)</text>
  <text x="137" y="238" fill="#e8e8ea" font-size="10.6" text-anchor="middle">pose = matrix_world</text>
  <text x="137" y="266" fill="#9adf9a" font-size="10" text-anchor="middle">mesh is cosmetic only</text>

  <!-- 2 tracer -->
  <rect x="288" y="92" width="206" height="190" rx="12" fill="#2b2113" stroke="#b08a4a" stroke-width="1.6"/>
  <text x="391" y="120" fill="#e0c07f" font-size="14.5" font-weight="700" text-anchor="middle">TRACER</text>
  <text x="391" y="142" fill="#cfd2d6" font-size="11" text-anchor="middle">single chief ray</text>
  <text x="391" y="172" fill="#e8e8ea" font-size="10.6" text-anchor="middle">reads properties ×</text>
  <text x="391" y="190" fill="#e8e8ea" font-size="10.6" text-anchor="middle">matrix_world per element</text>
  <text x="391" y="214" fill="#e8e8ea" font-size="10.6" text-anchor="middle">sequential multi-bounce</text>
  <text x="391" y="238" fill="#e8e8ea" font-size="10.6" text-anchor="middle">Snell · Fresnel · split</text>
  <text x="391" y="266" fill="#9adf9a" font-size="10" text-anchor="middle">byte-identical until you act</text>

  <!-- 3 physics -->
  <rect x="542" y="92" width="206" height="190" rx="12" fill="#221a2b" stroke="#9a6fb0" stroke-width="1.6"/>
  <text x="645" y="120" fill="#c79fe0" font-size="14.5" font-weight="700" text-anchor="middle">PHYSICS</text>
  <text x="645" y="142" fill="#cfd2d6" font-size="11" text-anchor="middle">analytic overlays</text>
  <text x="645" y="172" fill="#e8e8ea" font-size="10.6" text-anchor="middle">Jones / Stokes</text>
  <text x="645" y="190" fill="#e8e8ea" font-size="10.6" text-anchor="middle">Gaussian q-ABCD, M²</text>
  <text x="645" y="214" fill="#e8e8ea" font-size="10.6" text-anchor="middle">Zernike WFS + AO</text>
  <text x="645" y="238" fill="#e8e8ea" font-size="10.6" text-anchor="middle">vectorial Fresnel</text>
  <text x="645" y="266" fill="#9adf9a" font-size="10" text-anchor="middle">dependency-free physics.py</text>

  <!-- 4 readouts -->
  <rect x="796" y="92" width="116" height="190" rx="12" fill="#11261a" stroke="#5a9a5a" stroke-width="1.6"/>
  <text x="854" y="120" fill="#9adf9a" font-size="13.5" font-weight="700" text-anchor="middle">READOUTS</text>
  <text x="854" y="150" fill="#e8e8ea" font-size="10.2" text-anchor="middle">fringes</text>
  <text x="854" y="170" fill="#e8e8ea" font-size="10.2" text-anchor="middle">wavefront</text>
  <text x="854" y="190" fill="#e8e8ea" font-size="10.2" text-anchor="middle">power · η</text>
  <text x="854" y="210" fill="#e8e8ea" font-size="10.2" text-anchor="middle">Stokes</text>
  <text x="854" y="230" fill="#e8e8ea" font-size="10.2" text-anchor="middle">phenomena</text>
  <text x="854" y="252" fill="#e8e8ea" font-size="10.2" text-anchor="middle">renders</text>

  <line x1="240" y1="187" x2="286" y2="187" stroke="#8a8a92" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="494" y1="187" x2="540" y2="187" stroke="#8a8a92" stroke-width="2" marker-end="url(#a2)"/>
  <line x1="748" y1="187" x2="794" y2="187" stroke="#8a8a92" stroke-width="2" marker-end="url(#a2)"/>

  <!-- verified badge -->
  <rect x="288" y="304" width="460" height="34" rx="8" fill="#0f1a12" stroke="#5a9a5a" stroke-width="1.3"/>
  <text x="518" y="326" fill="#9adf9a" font-size="12" font-weight="600" text-anchor="middle">every core formula machine-verified against the physicist Docker oracle ✓</text>
</svg>
