<svg viewBox="0 0 940 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a92"/>
    </marker>
    <marker id="arrb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#4a8db0"/>
    </marker>
  </defs>
  <rect width="940" height="380" fill="#0d0d10"/>
  <text x="470" y="40" fill="#f4f4f6" font-size="21" font-weight="700" text-anchor="middle">An AI agent drives the bench — inspect, don't guess</text>
  <text x="470" y="64" fill="#8a8a92" font-size="12.5" text-anchor="middle">the trace is deterministic and byte-identical until you explicitly act</text>

  <!-- READ -->
  <rect x="40" y="110" width="200" height="150" rx="12" fill="#11212b" stroke="#4a8db0" stroke-width="1.6"/>
  <text x="140" y="138" fill="#7fc3e3" font-size="15" font-weight="700" text-anchor="middle">1 · READ</text>
  <text x="140" y="160" fill="#cfd2d6" font-size="11" text-anchor="middle">the numeric eyes</text>
  <text x="140" y="186" fill="#e8e8ea" font-size="10.5" text-anchor="middle">get_state · inspect_beam</text>
  <text x="140" y="204" fill="#e8e8ea" font-size="10.5" text-anchor="middle">inspect_element · beam_profile</text>
  <text x="140" y="222" fill="#e8e8ea" font-size="10.5" text-anchor="middle">diagnose · detect_phenomena</text>
  <text x="140" y="240" fill="#e8e8ea" font-size="10.5" text-anchor="middle">propose_corrections</text>

  <!-- DECIDE -->
  <rect x="280" y="110" width="190" height="150" rx="12" fill="#221a2b" stroke="#9a6fb0" stroke-width="1.6"/>
  <text x="375" y="138" fill="#c79fe0" font-size="15" font-weight="700" text-anchor="middle">2 · JUDGE</text>
  <text x="375" y="160" fill="#cfd2d6" font-size="11" text-anchor="middle">weigh user intent</text>
  <text x="375" y="188" fill="#e8e8ea" font-size="11" text-anchor="middle">corrections are ADVISORY</text>
  <text x="375" y="212" fill="#9adf9a" font-size="11.5" font-weight="600" text-anchor="middle">refuse · partial · accept</text>
  <text x="375" y="236" fill="#8a8a92" font-size="9.6" text-anchor="middle">maybe_intentional_if · fault_confidence</text>

  <!-- ACT -->
  <rect x="510" y="110" width="190" height="150" rx="12" fill="#2b2113" stroke="#b08a4a" stroke-width="1.6"/>
  <text x="605" y="138" fill="#e0c07f" font-size="15" font-weight="700" text-anchor="middle">3 · ACT</text>
  <text x="605" y="160" fill="#cfd2d6" font-size="11" text-anchor="middle">mutate the bench</text>
  <text x="605" y="188" fill="#e8e8ea" font-size="10.5" text-anchor="middle">set_param · place_relative</text>
  <text x="605" y="206" fill="#e8e8ea" font-size="10.5" text-anchor="middle">align_element · auto_align</text>
  <text x="605" y="224" fill="#e8e8ea" font-size="10.5" text-anchor="middle">ao_close_loop · tilt_null</text>

  <!-- RE-TRACE -->
  <rect x="740" y="110" width="160" height="150" rx="12" fill="#11261a" stroke="#5a9a5a" stroke-width="1.6"/>
  <text x="820" y="138" fill="#9adf9a" font-size="15" font-weight="700" text-anchor="middle">4 · RE-TRACE</text>
  <text x="820" y="162" fill="#cfd2d6" font-size="11" text-anchor="middle">light re-propagates</text>
  <text x="820" y="190" fill="#e8e8ea" font-size="10.5" text-anchor="middle">property-driven:</text>
  <text x="820" y="208" fill="#e8e8ea" font-size="10.5" text-anchor="middle">behaviour = params</text>
  <text x="820" y="226" fill="#e8e8ea" font-size="10.5" text-anchor="middle">× matrix_world</text>

  <!-- forward arrows -->
  <line x1="240" y1="185" x2="278" y2="185" stroke="#8a8a92" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="470" y1="185" x2="508" y2="185" stroke="#8a8a92" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="700" y1="185" x2="738" y2="185" stroke="#8a8a92" stroke-width="2" marker-end="url(#arr)"/>

  <!-- feedback arrow RE-TRACE -> READ -->
  <path d="M820 260 L820 320 L140 320 L140 262" fill="none" stroke="#4a8db0" stroke-width="2" marker-end="url(#arrb)"/>
  <text x="480" y="340" fill="#7fc3e3" font-size="11.5" text-anchor="middle">read again — never assert what the beam is doing</text>
</svg>
