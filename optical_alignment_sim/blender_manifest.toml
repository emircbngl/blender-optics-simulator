schema_version = "1.0.0"

id = "optical_alignment_sim"
version = "0.15.0"
name = "Optical Alignment & Simulation"
tagline = "Live ray tracing & auto-alignment for optical benches"
maintainer = "Emir <emircbngl@gmail.com>"
type = "add-on"

# EEVEE-Next era. The add-on resolves the EEVEE engine id at runtime, so it
# also works on Blender 5.x where the id is 'BLENDER_EEVEE'.
blender_version_min = "4.2.0"

license = ["SPDX:GPL-3.0-or-later"]
website = "https://github.com/emircbngl/blender-optics-simulator"
tags = ["3D View", "Render", "Object"]

[permissions]
network = "Localhost bridge lets an external MCP agent drive the scene"
files = "Import user mesh libraries; write converted meshes to the cache"
